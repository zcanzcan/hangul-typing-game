name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4
      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: 의존성 설치
        run: npm ci
      - name: 린트 검사
        run: npm run lint
      - name: 단위 테스트
        run: npm test
      - name: Playwright 브라우저 설치
        run: npx playwright install --with-deps chromium
      - name: 화면 흐름 테스트
        run: npm run test:e2e
      - name: 프로덕션 빌드
        run: npm run build
      - name: PWA 설치와 오프라인 검사
        run: npm run test:pwa
